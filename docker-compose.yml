version: "3.9"

services:
  autostream-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: autostream-agent
    image: autostream-agent:latest
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - leads_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

volumes:
  leads_data:
    driver: local
